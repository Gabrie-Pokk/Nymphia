<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="description" content="Nymphia — Plataforma de acompanhamento gestacional contínuo com inteligência artificial para gestantes e médicos. Cada batimento importa." />
    <title>Nymphia — Cada batimento importa</title>

    <!-- PWA Web App Manifest & Mobile Integration -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/lotus-logo.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="theme-color" content="#5C1A2A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nymphia" />

    <!-- Google Fonts: Inter Sans-serif (Sans-serif em toda a interface conforme especificação) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Registro automático do Service Worker para PWA e suporte offline da emergência -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[Nymphia PWA] Service Worker registrado com sucesso:', reg.scope);
            })
            .catch((err) => {
              console.warn('[Nymphia PWA] Falha ao registrar Service Worker:', err);
            });
        });
      }
    </script>
  </body>
</html>
