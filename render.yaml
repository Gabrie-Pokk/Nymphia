databases:
  - name: nymphia-postgres
    databaseName: nymphia
    user: nymphia_admin
    plan: free
    region: ohio

services:
  - type: web
    name: nymphia-plataforma-ia
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NYMPHIA_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ENV
        value: producao
      - key: NYMPHIA_DATABASE_URL
        fromDatabase:
          name: nymphia-postgres
          property: connectionString
      # Adicionados em 15/10/2026 (ver nymphia_backend/.env.example)
      - key: NYMPHIA_ADMIN_TOKEN
        generateValue: true
      - key: NYMPHIA_URL_PUBLICA
        value: https://nymphia-global.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: NYMPHIA_PROXIES_CONFIAVEIS
        value: "1"
