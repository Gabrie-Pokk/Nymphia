databases:
  - name: nymphia-postgres
    databaseName: nymphia
    user: nymphia_admin
    plan: free
    region: ohio

services:
  - type: web
    name: nymphia-plataforma-ia
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NYMPHIA_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ENV
        value: producao
      - key: NYMPHIA_DATABASE_URL
        fromDatabase:
          name: nymphia-postgres
          property: connectionString
      - key: NYMPHIA_BERTIMBAU_URL
        sync: false
